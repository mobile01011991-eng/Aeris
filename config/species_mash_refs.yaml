# Reference assemblies used to build Mash sketches for species ID.
# Accessions are NCBI RefSeq; build with: python scripts/build_species_mash_db.py

sketch:
  k: 21
  sketch_size: 1000
  # Mash distance at/under this → high-confidence species call
  distance_threshold: 0.05
  # Above this → treat as no reliable hit
  max_distance: 0.12

references:
